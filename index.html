<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fff4e6">
<title>Tap Tap Pop</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎈</text></svg>">
<style>
  :root {
    --bg: #fff4e6;
    --ink: #3b2f5c;
    --hint: rgba(59, 47, 92, 0.45);
    --glow: rgba(255, 255, 255, 0.7);
    --palette-1: #ff6b6b;
    --palette-2: #ffa94d;
    --palette-3: #fcc419;
    --palette-4: #51cf66;
    --palette-5: #339af0;
    --palette-6: #845ef7;
    --palette-7: #f06595;
    --size-item: clamp(72px, 18vmin, 180px);
    --size-hint: clamp(20px, 4vmin, 32px);
    --life: 2600ms;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1b2e;
      --ink: #f3f0ff;
      --hint: rgba(243, 240, 255, 0.5);
      --glow: rgba(255, 255, 255, 0.15);
    }
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    overscroll-behavior: none;
    cursor: pointer;
  }

  #stage { position: fixed; inset: 0; }

  #hint {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    font-size: var(--size-hint);
    color: var(--hint);
    pointer-events: none;
    transition: opacity 400ms ease;
    text-align: center;
    padding: 16px;
  }
  #hint span { display: block; font-size: calc(var(--size-hint) * 3); animation: wiggle 1.4s ease-in-out infinite; }
  #hint.gone { opacity: 0; }

  .item {
    position: absolute;
    translate: -50% -50%;
    font-size: var(--size-item);
    font-weight: 900;
    line-height: 1;
    pointer-events: none;
    text-shadow: 0 4px 0 var(--glow);
    animation: pop var(--life) cubic-bezier(.2, 1.4, .4, 1) forwards;
  }

  .ripple {
    position: absolute;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    translate: -50% -50%;
    pointer-events: none;
    opacity: 0.5;
    animation: ripple 700ms ease-out forwards;
  }

  @keyframes pop {
    0%   { scale: 0; rotate: var(--spin); opacity: 1; }
    18%  { scale: 1.25; rotate: 0deg; }
    30%  { scale: 1; }
    75%  { opacity: 1; translate: -50% -50%; }
    100% { scale: 0.6; opacity: 0; translate: -50% calc(-50% - 80px); }
  }
  @keyframes ripple {
    to { scale: 8; opacity: 0; }
  }
  @keyframes wiggle {
    0%, 100% { rotate: -10deg; }
    50% { rotate: 10deg; }
  }

  @media (prefers-reduced-motion: reduce) {
    .item { animation: fade var(--life) ease forwards; }
    .ripple { display: none; }
    #hint span { animation: none; }
    @keyframes fade { 0%, 75% { opacity: 1; } 100% { opacity: 0; } }
  }
</style>
</head>
<body>
<div id="stage" aria-label="Tap anywhere to play" role="application"></div>
<div id="hint"><div><span>👆</span>Tap anywhere!</div></div>

<script>
  const EMOJIS = [
    "🐶","🐱","🐭","🐰","🦊","🐻","🐼","🐨","🐯","🦁","🐮","🐷","🐸","🐵","🐔","🐧",
    "🐤","🦆","🦉","🐴","🦄","🐝","🦋","🐞","🐢","🐙","🐠","🐳","🐬","🦖","🐘","🦒",
    "🍎","🍌","🍓","🍉","🍇","🍒","🍊","🥕","🍪","🍦","🧁","🍩",
    "🚗","🚒","🚓","🚜","🚂","✈️","🚀","⛵","🚲",
    "⚽","🏀","🎈","🎁","🧸","🪁","🎨","🥁","🎺",
    "🌈","☀️","🌙","⭐","🌸","🌻","🌳","❤️","💛","💙","💚","💜"
  ];
  const MAX_NUMBER = 10;
  const MAX_ITEMS = 40;
  const NUMBER_CHANCE = 0.35;
  const PALETTE = [1, 2, 3, 4, 5, 6, 7].map(i => `var(--palette-${i})`);
  const LIFE_MS = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--life"), 10);

  const stage = document.getElementById("stage");
  const hint = document.getElementById("hint");
  let audio;

  const pick = list => list[Math.floor(Math.random() * list.length)];

  function chime(isNumber) {
    try {
      audio ??= new (window.AudioContext || window.webkitAudioContext)();
      const notes = [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5];
      const osc = audio.createOscillator();
      const gain = audio.createGain();
      osc.type = isNumber ? "triangle" : "sine";
      osc.frequency.value = pick(notes);
      gain.gain.setValueAtTime(0.0001, audio.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.25, audio.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + 0.5);
      osc.connect(gain).connect(audio.destination);
      osc.start();
      osc.stop(audio.currentTime + 0.5);
    } catch { /* sound is a bonus, never block the pop */ }
  }

  function say(text) {
    if (!("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.9;
    u.pitch = 1.3;
    speechSynthesis.speak(u);
  }

  function spawn(x, y) {
    hint.classList.add("gone");
    while (stage.childElementCount >= MAX_ITEMS) stage.firstElementChild.remove();

    const color = pick(PALETTE);
    const ripple = document.createElement("div");
    ripple.className = "ripple";
    ripple.style.cssText = `left:${x}px;top:${y}px;background:${color}`;
    stage.append(ripple);
    setTimeout(() => ripple.remove(), 700);

    const isNumber = Math.random() < NUMBER_CHANCE;
    const el = document.createElement("div");
    el.className = "item";
    el.style.left = `${x}px`;
    el.style.top = `${y}px`;
    el.style.setProperty("--spin", `${(Math.random() * 60 - 30).toFixed(0)}deg`);
    if (isNumber) {
      const n = 1 + Math.floor(Math.random() * MAX_NUMBER);
      el.textContent = n;
      el.style.color = color;
      say(String(n));
    } else {
      el.textContent = pick(EMOJIS);
    }
    stage.append(el);
    setTimeout(() => el.remove(), LIFE_MS);
    chime(isNumber);
  }

  window.addEventListener("pointerdown", e => {
    e.preventDefault();
    spawn(e.clientX, e.clientY);
  });

  // Keyboard mashing counts too: each key pops something somewhere random.
  window.addEventListener("keydown", e => {
    e.preventDefault();
    const pad = 80;
    spawn(pad + Math.random() * (innerWidth - pad * 2), pad + Math.random() * (innerHeight - pad * 2));
  });

  ["contextmenu", "gesturestart", "dblclick"].forEach(t => window.addEventListener(t, e => e.preventDefault()));
</script>
</body>
</html>
